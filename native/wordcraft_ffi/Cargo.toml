[package]
name = "wordcraft_ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "wordcraft_ffi"
crate-type = ["cdylib"]

[dependencies]
wordcraft-docx   = { git = "https://github.com/storytold/wordcraft", branch = "main" }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", branch = "main" }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", branch = "main" }
wordcraft-doc    = { git = "https://github.com/storytold/wordcraft", branch = "main" }
wordcraft-geom   = { git = "https://github.com/storytold/wordcraft", branch = "main" }
wordcraft-pdf    = { git = "https://github.com/storytold/wordcraft", branch = "main" }
regex            = { version = "1", default-features = false, features = ["std", "unicode"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
