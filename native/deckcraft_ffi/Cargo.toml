[package]
name = "deckcraft_ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "deckcraft_ffi"
crate-type = ["cdylib"]

[dependencies]
deckcraft-pptx   = { git = "https://github.com/storytold/deckcraft", branch = "main" }
deckcraft-render = { git = "https://github.com/storytold/deckcraft", branch = "main" }
deckcraft-model  = { git = "https://github.com/storytold/deckcraft", branch = "main" }
deckcraft-fonts  = { git = "https://github.com/storytold/deckcraft", branch = "main" }
deckcraft-geom   = { git = "https://github.com/storytold/deckcraft", branch = "main" }
deckcraft-pdf    = { git = "https://github.com/storytold/deckcraft", branch = "main" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
