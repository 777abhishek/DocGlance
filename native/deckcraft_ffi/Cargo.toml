[package]
name = "deckcraft_ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "deckcraft_ffi"
crate-type = ["cdylib"]

[dependencies]
deckcraft-pptx   = { git = "https://github.com/storytold/deckcraft", tag = "v0.15.0" }
deckcraft-render = { git = "https://github.com/storytold/deckcraft", tag = "v0.15.0" }
deckcraft-model  = { git = "https://github.com/storytold/deckcraft", tag = "v0.15.0" }
deckcraft-fonts  = { git = "https://github.com/storytold/deckcraft", tag = "v0.15.0" }
deckcraft-geom   = { git = "https://github.com/storytold/deckcraft", tag = "v0.15.0" }
# deckcraft-pdf removed — not used by the PPTX renderer FFI surface and
# generated an `unused_dependencies` cargo warning on every build.

[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }

[profile.release]
opt-level     = 3
lto            = "thin"
codegen-units = 1
strip         = "symbols"
